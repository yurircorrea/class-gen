<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contêineres</title>
<link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>

<div class="py-3 marcado-container">

  <div class="container mb-2">
    <div class="bloco bg-primary text-white">.container</div>
  </div>

  <div class="container-sm mb-2">
    <div class="bloco bg-danger text-white">.container-sm</div>
  </div>

  <div class="container-md mb-2">
    <div class="bloco bg-success text-white">.container-md</div>
  </div>

  <div class="container-lg mb-2">
    <div class="bloco bg-warning text-dark">.container-lg</div>
  </div>

  <div class="container-xl mb-2">
    <div class="bloco bg-info text-dark">.container-xl</div>
  </div>

  <div class="container-xxl mb-2">
    <div class="bloco bg-secondary text-white">.container-xxl</div>
  </div>

  <div class="container-fluid">
    <div class="bloco bg-dark text-white">.container-fluid &mdash; sempre 100%</div>
  </div>

  <p class="faixa mt-2 mb-0 text-center">
    Arraste a largura: cada contêiner &quot;trava&quot; em uma largura fixa ao cruzar o seu ponto de quebra.
  </p>

</div>

<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="demo.js"></script>
</body>
</html>
