<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posicionamento</title>
<link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="demo.css">
<style>
  html,body{height:380px}
  #palco-fixo{height:380px;background:#f6f8f7}
</style>
</head>
<body>

<div id="palco-fixo">

  <!-- fixo no topo: gruda no alto da janela (aqui, do simulador) -->
  <div class="bg-warning text-dark fixed-top p-3 shadow-sm">
    <code>.fixed-top</code> &mdash; fica colado no topo da janela
  </div>

  <!-- fixo no rodapé -->
  <div class="bg-success text-white fixed-bottom p-3 shadow-sm">
    <code class="text-white">.fixed-bottom</code> &mdash; fica colado no rodap&eacute;
  </div>

  <!-- centralizado de verdade -->
  <div class="bg-danger text-white p-4 rounded shadow position-absolute start-50 top-50 translate-middle text-center">
    <code class="text-white">.top-50 .start-50</code><br>
    <code class="text-white">.translate-middle</code>
  </div>

  <!-- canto inferior direito -->
  <div class="bg-dark text-white p-2 rounded position-absolute end-0" style="bottom:72px">
    <code class="text-white">.end-0</code>
  </div>

  <!-- meio da lateral esquerda -->
  <div class="bg-info text-dark p-2 rounded position-absolute start-0 top-50 translate-middle-y">
    <code>.start-0</code>
  </div>

</div>

<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="demo.js"></script>
</body>
</html>
